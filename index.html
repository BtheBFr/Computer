<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кто ты? Тест</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: radial-gradient(circle at top left, #1e3a8a, #0f172a 45%, #020617);
    color: #e5e7eb;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 720px;
    background: rgba(15, 23, 42, 0.86);
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
  }
  .progress {
    position: absolute; top: 0; left: 0; right: 0;
    height: 5px; background: rgba(148, 163, 184, 0.15);
  }
  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 5vw, 44px);
    line-height: 1.05;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { margin: 0 0 24px; color: #94a3b8; font-size: 16px; }
  .qtitle {
    font-size: 24px; font-weight: 700;
    margin: 0 0 20px; color: #f1f5f9;
    line-height: 1.3;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    border-radius: 16px;
    border: 1px solid rgba(148, 163, 184, 0.35);
    background: rgba(15, 23, 42, 0.8);
    cursor: pointer; user-select: none;
    transition: all 0.2s ease;
    font-size: 17px;
    font-weight: 500;
  }
  .opt:hover { 
    border-color: #60a5fa; 
    transform: translateY(-2px); 
    background: rgba(30, 58, 138, 0.4);
  }
  .opt.selected {
    border-color: #a78bfa;
    background: linear-gradient(135deg, rgba(96,165,250,0.25), rgba(167,139,250,0.25));
    box-shadow: 0 0 0 1px rgba(167,139,250,0.35);
  }
  input[type="text"] {
    width: 100%; padding: 16px;
    border-radius: 16px;
    border: 1px solid rgba(148, 163, 184, 0.35);
    background: rgba(2, 6, 23, 0.6);
    color: #e5e7eb;
    font-size: 17px;
    outline: none;
    transition: 0.2s ease;
    margin-bottom: 8px;
  }
  input[type="text"]:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96,165,250,0.2);
  }
  button {
    width: 100%; margin-top: 16px;
    padding: 16px; border: 0; border-radius: 16px;
    font-size: 17px; font-weight: 800; cursor: pointer;
    color: #0f172a;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
    transition: 0.2s ease;
  }
  button:hover { transform: translateY(-2px); filter: brightness(1.1); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.6; cursor: wait; transform: none; }
  
  .step { display: none; }
  .step.active { display: block; animation: fade 0.3s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .result-title {
    font-size: clamp(28px, 5vw, 42px);
    margin: 10px 0 12px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 900;
    line-height: 1.1;
  }
  .result-desc { color: #cbd5e1; font-size: 16px; margin: 0 0 20px; line-height: 1.5; }
  .result-name { color: #94a3b8; font-size: 15px; margin-bottom: 4px; }
  .result-device { color: #64748b; font-size: 14px; margin-bottom: 10px; }
  .status { margin-top: 16px; font-size: 14px; text-align: center; min-height: 20px; font-weight: 500; }
  .status.err { color: #f87171; }
  .status.ok { color: #4ade80; }
  
  .back {
    background: transparent; color: #94a3b8;
    font-weight: 600; font-size: 14px;
    padding: 10px; margin-top: 10px; width: auto;
    border: 1px solid rgba(148, 163, 184, 0.2);
  }
  .back:hover { color: #e5e7eb; background: rgba(255,255,255,0.05); transform: none; filter: none; }
</style>
</head>
<body>
  <main class="card">
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

    <!-- Шаг 0: Имя -->
    <section class="step active" data-step="0">
      <h1>Кто ты?</h1>
      <p class="subtitle">Как тебя зовут? Модель устройства определим сами.</p>
      <input id="nameInput" type="text" placeholder="Твоё имя" maxlength="40" autocomplete="off">
      <button id="startBtn">Начать</button>
      <div class="status" id="status0"></div>
    </section>

    <!-- Шаг 1 -->
    <section class="step" data-step="1">
      <p class="qtitle">1. Компьютер или телефон?</p>
      <div class="options" data-name="q1">
        <div class="opt" data-value="computer">Компьютер</div>
        <div class="opt" data-value="phone">Телефон</div>
      </div>
    </section>

    <!-- Шаг 2 -->
    <section class="step" data-step="2">
      <p class="qtitle">2. Смотришь ШГШ или Герасева на YouTube?</p>
      <div class="options" data-name="q2">
        <div class="opt" data-value="yes">Да</div>
        <div class="opt" data-value="no">Нет</div>
      </div>
    </section>

    <!-- Шаг 3 -->
    <section class="step" data-step="3">
      <p class="qtitle">3. Какая экосистема нравится больше?</p>
      <div class="options" data-name="q3">
        <div class="opt" data-value="iphone">Айфон</div>
        <div class="opt" data-value="apple">Эпл</div>
        <div class="opt" data-value="windows">Виндовс</div>
        <div class="opt" data-value="linux">Линукс</div>
        <div class="opt" data-value="android">Андроид</div>
      </div>
    </section>

    <!-- Шаг 4 -->
    <section class="step" data-step="4">
      <p class="qtitle">4. Ступаков или Алиева?</p>
      <div class="options" data-name="q4">
        <div class="opt" data-value="stupakov">Ступаков</div>
        <div class="opt" data-value="alieva">Алиева</div>
      </div>
    </section>

    <!-- Шаг 5: Результат -->
    <section class="step" data-step="5">
      <div class="result-name" id="resName"></div>
      <div class="result-title" id="resTitle"></div>
      <p class="result-desc" id="resDesc"></p>
      <div class="result-device" id="resDevice"></div>
      <div class="status" id="statusFinal"></div>
      <button class="back" id="restartBtn">Пройти заново</button>
    </section>
  </main>

<script>
  // URL твоего развернутого Apps Script
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwAKZi_RTLp1hBFSD1S6SM6VnhQuIDcmujICnGYpqNqS3NSAB-dRYaQVirINNAxVKPd8g/exec';

  const answers = { name: '', q1: '', q2: '', q3: '', q4: '' };
  const totalQuestions = 4;

  const steps = document.querySelectorAll('.step');
  const progressBar = document.getElementById('progressBar');
  const nameInput = document.getElementById('nameInput');
  const startBtn = document.getElementById('startBtn');
  const status0 = document.getElementById('status0');
  
  const resName = document.getElementById('resName');
  const resTitle = document.getElementById('resTitle');
  const resDesc = document.getElementById('resDesc');
  const resDevice = document.getElementById('resDevice');
  const statusFinal = document.getElementById('statusFinal');
  const restartBtn = document.getElementById('restartBtn');

  // Определение устройства
  function detectDevice() {
    const ua = navigator.userAgent;
    if (/iPhone/.test(ua)) return 'iPhone';
    if (/iPad/.test(ua)) return 'iPad';
    if (/iPod/.test(ua)) return 'iPod';
    if (/Android/.test(ua)) {
      let m = ua.match(/Android [\d.]+;\s*(?:[a-z]{2}[-_][a-z]{2};\s*)?([^;)]+?)(?:\s+Build|\))/i);
      let model = m && m[1] ? m[1].trim() : '';
      if (model && model.length > 1) return model + ' (Android)';
      return 'Android';
    }
    if (/Windows NT/.test(ua)) return 'Windows PC';
    if (/Macintosh|Mac OS X/.test(ua)) return 'Mac';
    if (/CrOS/.test(ua)) return 'Chromebook';
    if (/Linux/.test(ua)) return 'Linux PC';
    return 'Неизвестное устройство';
  }
  const DEVICE = detectDevice();

  // Переключение шагов
  function goTo(step) {
    steps.forEach(s => s.classList.toggle('active', Number(s.dataset.step) === step));
    let pct = 0;
    if (step >= 1 && step <= totalQuestions) pct = (step / totalQuestions) * 100;
    if (step === 5) pct = 100;
    progressBar.style.width = pct + '%';
  }

  // Старт (ввод имени)
  startBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) {
      status0.textContent = 'Пожалуйста, введи имя.';
      status0.className = 'status err';
      return;
    }
    answers.name = name;
    status0.textContent = '';
    goTo(1);
  });

  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') startBtn.click();
  });

  // Обработка кликов по вариантам
  document.querySelectorAll('.options').forEach(group => {
    const qKey = group.dataset.name;
    group.querySelectorAll('.opt').forEach(opt => {
      opt.addEventListener('click', () => {
        // Визуальное выделение
        group.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        answers[qKey] = opt.dataset.value;

        // Задержка для красоты и автопереход
        setTimeout(() => {
          const stepNum = Number(group.closest('.step').dataset.step);
          if (stepNum < 4) {
            goTo(stepNum + 1);
          } else {
            finish();
          }
        }, 250);
      });
    });
  });

  // Подсчет результатов
  function calcResult(q1, q2, q3, q4) {
    if (q1 === 'computer' && q2 === 'yes' && (q3 === 'windows' || q3 === 'linux') && q4 === 'stupakov') {
      return { title: 'Компьютерщик-ВПНщик', desc: 'ПК, YouTube через VPN и любимая ОС — Windows/Linux. Ты в своей стихии.' };
    }
    if (q1 === 'phone' && q2 === 'no' && q3 === 'windows' && q4 === 'stupakov') {
      return { title: 'Андроидщик-Компьютерщик', desc: 'Телефон в руке, но душа тянется к ПК и Windows.' };
    }
    if (q3 === 'android') {
      return { title: 'Андроидщик', desc: 'Android — твоя экосистема. Кастомизация, root, свобода.' };
    }
    if (q3 === 'iphone' || q3 === 'apple') {
      return { title: 'Эплщик', desc: 'Экосистема Apple: iCloud, Mac, iPhone — всё синхронно.' };
    }
    if (q2 === 'yes') {
      return { title: 'ВПНщик', desc: 'YouTube — твой дом. Без VPN никуда.' };
    }
    if (q1 === 'computer' && (q3 === 'windows' || q3 === 'linux')) {
      return { title: 'Компьютерщик', desc: 'ПК — твой инструмент. Windows или Linux — не важно, главное мощь.' };
    }
    return { title: 'Андроидщик', desc: 'Android — твой выбор по умолчанию.' };
  }

  // Завершение и отправка
  async function finish() {
    const res = calcResult(answers.q1, answers.q2, answers.q3, answers.q4);

    resName.textContent = 'Имя: ' + answers.name;
    resTitle.textContent = 'Ты ' + res.title;
    resDesc.textContent = res.desc;
    resDevice.textContent = 'Твоё устройство: ' + DEVICE;
    
    statusFinal.textContent = 'Сохраняем в таблицу...';
    statusFinal.className = 'status';
    goTo(5);

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          name: answers.name,
          device: DEVICE,
          q1: answers.q1,
          q2: answers.q2,
          q3: answers.q3,
          q4: answers.q4,
          result: res.title,
          userAgent: navigator.userAgent
        })
      });
      statusFinal.textContent = 'Сохранено ✅';
      statusFinal.className = 'status ok';
    } catch (err) {
      statusFinal.textContent = 'Ошибка сохранения (проверь скрипт)';
      statusFinal.className = 'status err';
      console.error(err);
    }
  }

  // Перезапуск
  restartBtn.addEventListener('click', () => {
    answers.name = ''; answers.q1 = ''; answers.q2 = ''; answers.q3 = ''; answers.q4 = '';
    nameInput.value = '';
    document.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
    statusFinal.textContent = '';
    goTo(0);
  });
</script>
</body>
</html>
